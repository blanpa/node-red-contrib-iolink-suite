name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node the package claims to support, and the current LTS.
        node: ['18', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  node-red:
    # The nodes installed from the packed tarball into the official Node-RED
    # image: this is what catches anything missing from package.json "files".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.test.yml run --rm --build integration
      - name: Node-RED log on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs node-red
