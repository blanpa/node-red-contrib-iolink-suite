<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 60" width="40" height="60" fill="#fff">
  <!-- An M12 connector face: what an IO-Link device is plugged in with.
       White on transparent, 2:3, as Node-RED wants its node icons. -->
  <rect x="17" y="0.5" width="6" height="6" rx="1"/>
  <circle cx="20" cy="18" r="13" fill="none" stroke="#fff" stroke-width="3.6"/>
  <circle cx="20" cy="11.4" r="2.4"/>
  <circle cx="13.4" cy="18" r="2.4"/>
  <circle cx="26.6" cy="18" r="2.4"/>
  <circle cx="20" cy="24.6" r="2.4"/>
  <!-- Reading: values leave the device and come down into the flow. -->
  <path d="M17.5 36 h5 v9 H28 L20 56 12 45 h5.5 z"/>
</svg>
