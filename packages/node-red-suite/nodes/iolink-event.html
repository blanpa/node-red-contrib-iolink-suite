<script type="text/javascript">
  RED.nodes.registerType('iolink-event', {
    category: 'IO-Link',
    color: '#c0deed',
    defaults: {
      name: { value: '' },
      master: { value: '', type: 'iolink-master', required: true },
      ports: { value: '' },
      interval: { value: 2000, required: true, validate: RED.validators.number() }
    },
    inputs: 1,
    outputs: 1,
    icon: 'font-awesome/fa-bell',
    label: function () {
      return this.name || (this.ports ? 'events port ' + this.ports : 'IO-Link events')
    },
    oneditprepare: function () {
      $('#iolink-scan').on('click', function () {
        const masterId = $('#node-input-master').val()
        const status = $('#iolink-scan-status').text('scanning…').css('color', '')
        if (!masterId || masterId === '_ADD_') {
          return status.css('color', '#a44').text('choose and deploy a master first')
        }
        $.getJSON('iolink-suite/scan/' + masterId)
          .done(function (ports) {
            const used = ports.filter(function (p) { return p.connected })
            status.css('color', '#4a4').text(used.length + ' of ' + ports.length + ' ports in use')
            const list = $('#iolink-ports').empty()
            ports.forEach(function (p) {
              const label = 'Port ' + p.port + ' — ' +
                (p.connected ? (p.productName || 'device ' + p.deviceId) : 'empty') +
                (p.statusText ? ' (' + p.statusText + ')' : '')
              $('<div>').css({ padding: '2px 0', color: p.connected ? '' : '#888' })
                .text(label).appendTo(list)
            })
          })
          .fail(function (xhr) {
            const body = xhr.responseJSON || {}
            status.css('color', '#a44').text(body.error || 'scan failed')
          })
      })
    }
  })
</script>

<script type="text/html" data-template-name="iolink-event">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name">
  </div>
  <div class="form-row">
    <label for="node-input-master"><i class="fa fa-server"></i> Master</label>
    <input type="text" id="node-input-master">
  </div>
  <div class="form-row">
    <label for="node-input-ports"><i class="fa fa-plug"></i> Ports</label>
    <input type="text" id="node-input-ports" placeholder="all ports">
  </div>
  <div class="form-row">
    <label for="node-input-interval"><i class="fa fa-clock-o"></i> Poll</label>
    <input type="text" id="node-input-interval" style="width:100px"> ms
  </div>
  <div class="form-row">
    <button type="button" class="red-ui-button" id="iolink-scan">
      <i class="fa fa-search"></i> Scan master
    </button>
    <span id="iolink-scan-status" style="margin-left:10px"></span>
  </div>
  <div class="form-row">
    <div id="iolink-ports"
         style="max-height:180px;overflow:auto;border:1px solid #ccc;border-radius:4px;padding:6px">
      <div class="form-tips">Scan to see which ports this master currently has,
        then list the ones to watch above — comma separated, or leave empty for all.</div>
    </div>
  </div>
</script>

<script type="text/html" data-help-name="iolink-event">
  <p>Watches the ports of a master and emits a message when something changes:
     a device is plugged in or pulled, a port leaves operate, a wire breaks, or a
     different device type appears on a port.</p>

  <h3>Why it polls</h3>
  <p>Masters differ in whether they can push events at all, so this node polls
     port status and compares. It sends only on a change, so a healthy plant stays
     quiet. The first poll after deploy establishes the baseline and emits
     nothing — otherwise every port would raise an alarm on restart.</p>

  <h3>Output</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd>Port number, connection state, status and mode with their plain-language
        text, and the identity of the device that is there now.</dd>
    <dt>changes <span class="property-type">array</span></dt>
    <dd>One entry per field that moved, with <code>from</code> and <code>to</code>.</dd>
    <dt>event <span class="property-type">object</span></dt>
    <dd>The transition named in the terms of the IO-Link specification — device
        appeared, device disappeared, device changed, status changed — with the
        matching EventCode and its description.</dd>
  </dl>
  <p>An input message polls once immediately, which is useful for reporting state
     on demand rather than waiting for the next tick.</p>
</script>
