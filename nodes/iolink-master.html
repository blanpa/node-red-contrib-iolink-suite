<script type="text/javascript">
  RED.nodes.registerType('iolink-master', {
    category: 'config',
    defaults: {
      name: { value: '' },
      profile: { value: 'ifm', required: true },
      host: { value: '', required: false },
      httpPort: { value: '' },
      url: { value: '' },
      tls: { value: false },
      timeout: { value: 5000, validate: RED.validators.number() },
      ports: { value: '1,2,3,4,5,6,7,8' },
      ioddRetryAfter: { value: 60000, validate: RED.validators.number(true) },
      language: { value: 'en' },
      keyStyle: { value: 'preserve' },
      ioddDir: { value: '' },
      ioddCacheDir: { value: '' },
      offline: { value: false },
      paths: { value: '' },
      valuePath: { value: '' },
      masterNumber: { value: 1 }
    },
    credentials: {
      user: { type: 'text' },
      password: { type: 'password' }
    },
    label: function () {
      return this.name || this.host || this.url || 'IO-Link master'
    },
    oneditprepare: function () {
      const node = this
      $.getJSON('iolink-suite/profiles', function (profiles) {
        const select = $('#node-config-input-profile').empty()
        profiles.forEach(function (p) {
          select.append($('<option>').val(p.id).text(p.label).data('profile', p))
        })
        select.val(node.profile || 'ifm').trigger('change')
      })
      $('#node-config-input-profile').on('change', function () {
        const id = $(this).val()
        $('.iolink-generic-only').toggle(id === 'generic')
        $('.iolink-jsonapi-only').toggle(id === 'jsonapi')
        // What the profile rests on, said where the choice is made: none has
        // been checked against a master yet, and a dialog that implied
        // otherwise would be believed.
        const p = $(this).find('option:selected').data('profile')
        $('#iolink-profile-basis').text(p
          ? 'Built from ' + p.basis + (p.verified ? ', verified against a master.' : '; not yet verified against a master.')
          : '')
      })
      $('#iolink-test').on('click', function () {
        const status = $('#iolink-test-result').text('testing…').css('color', '')
        // Identify, not scan: this question is "are the host, the credentials
        // and the profile right", and a master with nothing plugged in yet
        // should answer it. The node must exist on the server to be asked
        // anything at all, so say that rather than fail obscurely.
        $.getJSON('iolink-suite/identify/' + node.id)
          .done(function (info) {
            const name = [info.product, info.serial && '#' + info.serial]
              .filter(Boolean).join(' ')
            status.css('color', '#4a4').text(name ? 'reached ' + name : 'master reached')
          })
          .fail(function (xhr) {
            const body = xhr.responseJSON || {}
            status.css('color', '#a44')
              .text(body.error || 'failed — deploy the master once before testing')
          })
      })
    }
  })
</script>

<script type="text/html" data-help-name="iolink-master">
  <p>Connection to one IO-Link master. Every read, write, parameter and event node
     refers to a master node, and they share its IODD cache.</p>

  <h3>Profiles</h3>
  <p>Every profile was built from its interface's documentation and tested
     against a stand-in that speaks it; none has yet been checked against a
     master on a bench. <code>scripts/record-master.js</code> captures what a
     real master answers, so a difference can be seen and fixed.</p>
  <dl class="message-properties">
    <dt>ifm IoT Core</dt>
    <dd>ifm AL13xx / AL19xx / AL2xxx, after ifm's IoT Core documentation: one
        POST endpoint, the address in the body.</dd>
    <dt>IO-Link JSON API</dt>
    <dd>The IO-Link Community's "JSON Integration for IO-Link" REST interface,
        which several vendors share — Balluff and Pepperl+Fuchs among them.
        Everything sits under <code>/iolink/v1</code>; a gateway that holds
        several masters numbers them, so say which. Ports renamed in the
        master's configuration are found by their alias.</dd>
    <dt>Generic HTTP/JSON</dt>
    <dd>For a master with a REST API of its own shape. Configure the path templates
        (<code>{port}</code>, <code>{index}</code>, <code>{subindex}</code>,
        <code>{value}</code>) and which field of the reply carries the value.
        A working configuration is worth contributing back as a preset.
        <p><code>readVendorId</code> and <code>readDeviceId</code> are the two
        that decide whether IODDs can be looked up at all. Without them the
        read, write and parameter nodes need the ids set on the node itself.
        A path the master refuses is dropped rather than retried every poll.</p></dd>
  </dl>

  <h3>IODDs</h3>
  <p>IODDs are looked up automatically from the vendorId and deviceId the device
     reports, then cached on disk. Files in the <b>IODD folder</b> take priority,
     so a plant can pin a specific IODD. Tick <b>Offline</b> for machines with no
     internet: only the folder and the cache are then used.</p>

  <p>A device whose IODD is nowhere to be found is remembered as such for
     <b>Retry after</b>, so one unpublished device on the rack does not send a
     request to IODDfinder on every poll for as long as the flow runs. Dropping
     the missing IODD into the folder and redeploying clears that immediately.</p>

  <h3>Connection</h3>
  <p>Give a <b>Host</b>, and optionally an HTTP port and HTTPS. A master that
     lives behind a path or a proxy takes a full <b>Base URL</b> instead, which
     overrides both.</p>

  <h3>Test connection</h3>
  <p>Asks the master to identify itself and reports what answered. The master
     must have been deployed at least once, since the test runs against the
     deployed configuration. It says nothing about what is plugged in — the
     <b>iolink scan</b> node answers that.</p>
</script>
