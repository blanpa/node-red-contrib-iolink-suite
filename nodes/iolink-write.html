<script type="text/javascript">
  RED.nodes.registerType('iolink-write', {
    category: 'IO-Link',
    color: '#c0deed',
    defaults: {
      name: { value: '' },
      master: { value: '', type: 'iolink-master', required: true },
      port: { value: '1', required: true },
      portType: { value: 'num' },
      values: { value: '' },
      variant: { value: '' },
      merge: { value: true },
      ignoreRange: { value: false },
      identityTtl: { value: 30000 },
      vendorId: { value: '' },
      deviceId: { value: '' }
    },
    inputs: 1,
    outputs: 1,
    icon: 'iolink-write.svg',
    label: function () { return this.name || ('write port ' + (this.port || '?')) },
    oneditprepare: function () {
      $('#node-input-port').typedInput({
        default: 'num',
        typeField: '#node-input-portType',
        types: ['num', 'msg', 'flow', 'global', 'env']
      })
      $('#iolink-scan').on('click', function () {
        const masterId = $('#node-input-master').val()
        const port = $('#node-input-port').val()
        const status = $('#iolink-scan-status').text('scanning…').css('color', '')
        if (!masterId || masterId === '_ADD_') {
          return status.css('color', '#a44').text('choose and deploy a master first')
        }
        $.getJSON('iolink-suite/datapoints/' + masterId + '/' + encodeURIComponent(port) + '?direction=out')
          .done(function (result) {
            if (result.error) return status.css('color', '#b8860b').text(result.error)
            status.css('color', '#4a4').text(
              result.device.vendorName + ' ' + result.device.productName)
            const list = $('#iolink-writable').empty()
            ;(result.items || []).forEach(function (item) {
              const range = (item.min !== undefined && item.max !== undefined)
                ? ' ' + item.min + '…' + item.max : ''
              $('<div>').css({ padding: '2px 0', cursor: 'pointer' })
                .text(item.name + ' — ' + item.type + item.bitLength +
                      (item.unit ? ' [' + item.unit + ']' : '') + range)
                .on('click', function () {
                  // Clicking a value drops a template into the editor, which is
                  // faster and less error-prone than typing the exact key.
                  const field = $('#node-input-values')
                  let current = {}
                  try { current = JSON.parse(field.val() || '{}') } catch (e) { current = {} }
                  current[item.key] = item.type === 'Boolean' ? true : (item.min || 0)
                  field.val(JSON.stringify(current))
                })
                .appendTo(list)
            })
          })
          .fail(function (xhr) {
            const body = xhr.responseJSON || {}
            status.css('color', '#a44').text(body.error || 'scan failed')
          })
      })
    }
  })
</script>

<script type="text/html" data-template-name="iolink-write">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name">
  </div>
  <div class="form-row">
    <label for="node-input-master"><i class="fa fa-server"></i> Master</label>
    <input type="text" id="node-input-master">
  </div>
  <div class="form-row">
    <label for="node-input-port"><i class="fa fa-plug"></i> Port</label>
    <input type="text" id="node-input-port">
    <input type="hidden" id="node-input-portType">
  </div>
  <div class="form-row">
    <button type="button" class="red-ui-button" id="iolink-scan">
      <i class="fa fa-search"></i> Scan writable values
    </button>
    <span id="iolink-scan-status" style="margin-left:10px"></span>
  </div>
  <div class="form-row">
    <div id="iolink-writable"
         style="max-height:160px;overflow:auto;border:1px solid #ccc;border-radius:4px;padding:6px">
      <div class="form-tips">Scan to list what this device accepts. Click a value to add it below.</div>
    </div>
  </div>
  <div class="form-row">
    <label for="node-input-values"><i class="fa fa-pencil"></i> Values</label>
    <input type="text" id="node-input-values" placeholder='{"Valve": true}'>
  </div>
  <div class="form-row">
    <label for="node-input-merge"><i class="fa fa-object-group"></i> Merge</label>
    <input type="checkbox" id="node-input-merge" style="width:auto">
    <span>Read the current output first and change only the values given</span>
  </div>
  <div class="form-row">
    <label for="node-input-ignoreRange"><i class="fa fa-exclamation-triangle"></i> Range</label>
    <input type="checkbox" id="node-input-ignoreRange" style="width:auto">
    <span>Allow values outside the IODD's declared range</span>
  </div>
</script>

<script type="text/html" data-help-name="iolink-write">
  <p>Writes process data output — valves, actuators, signal towers — by value
     name rather than by bit position.</p>

  <h3>Input</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object</span></dt>
    <dd><code>{ "Valve": true, "Intensity": 42 }</code>. Values configured in the
        node act as defaults that the payload overrides. Enumerated values accept
        the IODD's own wording as well as the number.</dd>
  </dl>

  <h3>Merge</h3>
  <p>With <b>Merge</b> on (the default) the device's current output is read first
     and used as the starting point, so setting one field leaves the rest alone.
     Turn it off only when the message always carries every value: without the
     merge, writing <code>{"Valve": true}</code> to a manifold zeroes every other
     valve. If the master cannot read its output back, the node says so rather
     than writing a partly zeroed block.</p>

  <h3>Range checking</h3>
  <p>Values outside the range the IODD declares are rejected. Some vendors declare
     a range narrower than the device accepts; <b>Range</b> lifts the check for
     those cases.</p>
</script>
